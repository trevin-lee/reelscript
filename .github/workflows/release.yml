name: Release

# Publishes to npm when a GitHub release is published. The release tag must be
# v<version> and match package.json, e.g. tag v0.1.0 for version 0.1.0.
#
# Auth uses npm trusted publishing (OIDC): no npm token is stored in GitHub.
# One-time setup on npmjs.com -> @reelscript/cli -> Settings -> Trusted publisher:
#   provider: GitHub Actions, owner: trevin-lee, repo: reelscript, workflow: release.yml

on:
  release:
    types: [published]
  # Manual run from main, e.g. to publish image tags for a release whose
  # automatic run failed. Publishes whatever version package.json says.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing + provenance
  packages: write # push the container image to GHCR (image job)

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.v }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::release tag $TAG does not match package.json version $PKG"
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: version
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Only now: npm ci above ran with Node's own npm, like CI, because npm 12 blocks
      # dependencies' install scripts (ffmpeg-static's download among them).
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest && npm --version
      # prepublishOnly builds dist and runs the tests before upload. Skipped
      # when this version is already on npm (e.g. first release published by
      # hand), so the image tags below still get published.
      - name: Publish to npm unless this version already exists
        run: |
          if npm view "$(node -p "require('./package.json').name")@${{ steps.version.outputs.v }}" version >/dev/null 2>&1; then
            echo "already on npm, skipping publish"
          else
            npm publish --provenance --access public
          fi

  # Container image for amd64 and arm64: the npm version's tag, plus latest.
  image:
    needs: publish
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true
      tags: |
        ghcr.io/trevin-lee/reelscript:${{ needs.publish.outputs.version }}
        ghcr.io/trevin-lee/reelscript:latest
