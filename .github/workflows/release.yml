name: Release

# Publishes to npm when a GitHub release is published. The release tag must be
# v<version> and match package.json, e.g. tag v0.1.0 for version 0.1.0.
#
# Auth uses npm trusted publishing (OIDC): no npm token is stored in GitHub.
# One-time setup on npmjs.com -> @reelscript/cli -> Settings -> Trusted publisher:
#   provider: GitHub Actions, owner: trevin-lee, repo: reelscript, workflow: release.yml

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing + provenance
  packages: write # push the container image to GHCR

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: Check release tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::release tag $TAG does not match package.json version $PKG"
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: version
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # prepublishOnly builds dist and runs the tests before upload. Skipped
      # when this version is already on npm (e.g. first release published by
      # hand), so the image tags below still get published.
      - name: Publish to npm unless this version already exists
        run: |
          if npm view "$(node -p "require('./package.json').name")@${{ steps.version.outputs.v }}" version >/dev/null 2>&1; then
            echo "already on npm, skipping publish"
          else
            npm publish --provenance --access public
          fi

      # Container image: same version tag as the npm package, plus latest.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/trevin-lee/reelscript:${{ steps.version.outputs.v }}
            ghcr.io/trevin-lee/reelscript:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
