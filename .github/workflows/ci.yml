name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Cache the narration model and synthesized clips
        uses: actions/cache@v4
        with:
          path: ~/.cache/reelscript
          key: reelscript-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run typecheck
      - run: npm test
      - name: Render the example end to end
        run: npm run example
      - uses: actions/upload-artifact@v5
        with:
          name: example-demo
          path: out/basic.mp4
          retention-days: 7

  # The README GIF is a demo of reelscript made with reelscript, rendered
  # inside the container image so the Dockerfile is exercised on every push
  # and the GIF comes from the canonical environment. Committed back if the
  # pixels changed.
  demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: reelscript:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Render the demo inside the container
        run: docker run --rm -v "$PWD:/work" reelscript:ci render examples/basic.ts --out docs/demo.gif
      - name: Commit the demo if it changed
        run: |
          sudo chown "$(id -u):$(id -g)" docs/demo.gif
          if git diff --quiet -- docs/demo.gif; then
            echo "demo.gif unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          git commit -m "docs: re-render demo.gif"
          git pull --rebase
          git push
