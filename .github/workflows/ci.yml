name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/trevin-lee/reelscript

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Cache the narration model and synthesized clips
        uses: actions/cache@v4
        with:
          path: ~/.cache/reelscript
          key: reelscript-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run typecheck
      - run: npm test
      - name: Check every example (no rendering)
        run: npm run build && node dist/cli.js check examples/*.ts
      - name: Render the example end to end
        run: npm run example
      - name: Render a frame of the editor example (downloads code-server once, then cached)
        run: node dist/cli.js preview examples/editor.ts --at 9 --out out/editor-frame.png
      - name: Render a frame of the extension example (loads examples/acme-ext into VS Code)
        run: node dist/cli.js preview examples/extension.ts --at 10.5 --out out/extension-frame.png
      - uses: actions/upload-artifact@v5
        with:
          name: example-demo
          path: |
            examples/out/basic.mp4
            out/editor-frame.png
            out/extension-frame.png
          retention-days: 7

  # Container image. Built on every PR and push; pushed to GHCR from main as
  # :main and :sha-<commit>. Releases add :<version> and :latest (release.yml).
  # Container image for amd64 and arm64, smoke-tested natively on each.
  # Pushes from main publish :main and :sha-<commit>.
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      push: ${{ github.event_name == 'push' }}
      tags: |
        ghcr.io/trevin-lee/reelscript:main
        ghcr.io/trevin-lee/reelscript:sha-${{ github.sha }}

  # The README GIF is a demo of reelscript made with reelscript, rendered by
  # the image that was just published. Committed back if the pixels changed.
  demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache synthesized narration clips
        uses: actions/cache@v4
        with:
          path: ~/.cache/reelscript/tts
          key: reelscript-tts-${{ hashFiles('examples/**/*.ts') }}
          restore-keys: reelscript-tts-
      - name: Render the demo with the published image
        run: |
          mkdir -p ~/.cache/reelscript
          docker run --rm -v "$PWD:/work" -v "$HOME/.cache/reelscript:/cache" \
            "$IMAGE:sha-${{ github.sha }}" render examples/basic.ts --out docs/demo.gif
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/reelscript
      - name: Commit the demo if it changed visibly
        run: |
          sudo chown "$(id -u):$(id -g)" docs/demo.gif
          if git diff --quiet -- docs/demo.gif; then
            echo "demo.gif unchanged"
            exit 0
          fi
          # Chromium's text rasterizing varies pixel values invisibly between
          # runs; only commit a re-render that differs visibly (PSNR under
          # 40 dB) or has a different number of frames.
          git show HEAD:docs/demo.gif > /tmp/old.gif
          cp docs/demo.gif /tmp/new.gif
          ff() { docker run --rm -v /tmp:/tmp --entrypoint /opt/reelscript/node_modules/ffmpeg-static/ffmpeg "$IMAGE:sha-${{ github.sha }}" "$@"; }
          old_frames=$(ff -v error -i /tmp/old.gif -f framemd5 - | grep -vc "^#")
          new_frames=$(ff -v error -i /tmp/new.gif -f framemd5 - | grep -vc "^#")
          if [ "$old_frames" = "$new_frames" ]; then
            ff -v error -i /tmp/old.gif -i /tmp/new.gif -lavfi "[0:v][1:v]psnr=stats_file=/tmp/psnr.log" -f null -
            worst=$(awk '{for(i=1;i<=NF;i++) if($i ~ /^psnr_avg:/){split($i,a,":"); if(a[2]!="inf" && (m=="" || a[2]+0<m+0)) m=a[2]}} END{print (m=="" ? 999 : m)}' /tmp/psnr.log)
            echo "frames: $new_frames, worst PSNR: $worst dB"
            if awk -v w="$worst" 'BEGIN{exit !(w >= 40)}'; then
              echo "demo.gif differs only invisibly; not committing"
              git checkout -- docs/demo.gif
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          git commit -m "docs: re-render demo.gif"
          git pull --rebase
          git push
