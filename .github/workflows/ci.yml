name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/trevin-lee/reelscript

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Cache the narration model and synthesized clips
        uses: actions/cache@v4
        with:
          path: ~/.cache/reelscript
          key: reelscript-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run typecheck
      - run: npm test
      - name: Render the example end to end
        run: npm run example
      - name: Render a frame of the editor example (downloads code-server once, then cached)
        run: node dist/cli.js preview examples/editor.ts --at 9 --out out/editor-frame.png
      - name: Render a frame of the extension example (loads examples/acme-ext into VS Code)
        run: node dist/cli.js preview examples/extension.ts --at 10.5 --out out/extension-frame.png
      - uses: actions/upload-artifact@v5
        with:
          name: example-demo
          path: |
            out/basic.mp4
            out/editor-frame.png
            out/extension-frame.png
          retention-days: 7

  # Container image. Built on every PR and push; pushed to GHCR from main as
  # :main and :sha-<commit>. Releases add :<version> and :latest (release.yml).
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The README GIF is a demo of reelscript made with reelscript, rendered by
  # the image that was just published. Committed back if the pixels changed.
  demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache synthesized narration clips
        uses: actions/cache@v4
        with:
          path: ~/.cache/reelscript/tts
          key: reelscript-tts-${{ hashFiles('examples/**/*.ts') }}
          restore-keys: reelscript-tts-
      - name: Render the demo with the published image
        run: |
          mkdir -p ~/.cache/reelscript/tts
          docker run --rm -v "$PWD:/work" -v "$HOME/.cache/reelscript/tts:/opt/reelscript/cache/tts" \
            "$IMAGE:${{ needs.image.outputs.tag }}" render examples/basic.ts --out docs/demo.gif
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/reelscript
      - name: Commit the demo if it changed
        run: |
          sudo chown "$(id -u):$(id -g)" docs/demo.gif
          if git diff --quiet -- docs/demo.gif; then
            echo "demo.gif unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          git commit -m "docs: re-render demo.gif"
          git pull --rebase
          git push
