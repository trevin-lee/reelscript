name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Render the example end to end
        run: npm run example
      - uses: actions/upload-artifact@v5
        with:
          name: example-demo
          path: out/basic.mp4
          retention-days: 7

  # The README GIF is a demo of reelscript made with reelscript. Re-render it
  # on every push to main and commit it back if the pixels changed.
  demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx src/cli.ts render examples/basic.ts --out docs/demo.gif
      - name: Commit the demo if it changed
        run: |
          if git diff --quiet -- docs/demo.gif; then
            echo "demo.gif unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          git commit -m "docs: re-render demo.gif"
          git pull --rebase
          git push
