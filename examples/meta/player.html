<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rendered demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0d10; }
  video { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<!-- Plays the video named by ?v= from the start, as it was rendered: the meta example shows each script's real output. -->
<video id="v" muted playsinline></video>
<script>
  const v = document.getElementById("v");
  v.src = new URLSearchParams(location.search).get("v");
  v.play();
</script>
</body>
</html>
